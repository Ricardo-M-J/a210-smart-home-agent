<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A210 智能家居视觉 Agent</title>
  <style>
    :root {
      --bg: #1c1b1a;
      --panel: #282625;
      --border: #3a3836;
      --text: #f0edea;
      --muted: #a8a29e;
      --accent: #d9a441;
      --accent-dim: #b8862e;
      --ok: #5b8c5a;
      --warn: #d9a441;
      --alert: #c95b4e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok); display: inline-block;
    }
    header .sub { color: var(--muted); font-size: 12px; }
    .layout {
      flex: 1; display: grid;
      grid-template-columns: 1fr 340px;
      gap: 12px; padding: 12px; overflow: hidden;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; display: flex; flex-direction: column;
      overflow: hidden;
    }
    .card h2 {
      font-size: 13px; font-weight: 600; padding: 12px 14px;
      border-bottom: 1px solid var(--border); color: var(--accent);
    }
    /* 聊天区 */
    .chat-body {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 78%; padding: 10px 12px; border-radius: 10px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--accent-dim); color: #fff; }
    .msg.agent { align-self: flex-start; background: #33302e; }
    .chat-input {
      display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border);
    }
    .chat-input input {
      flex: 1; background: #1c1b1a; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px;
    }
    .chat-input button {
      background: var(--accent); border: none; color: #1c1b1a;
      padding: 0 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .chat-input button:disabled { opacity: .5; cursor: not-allowed; }
    /* 右侧列 */
    .right-col { display: flex; flex-direction: column; gap: 12px; }
    .scene-row { display: flex; gap: 8px; padding: 12px; }
    .scene-row select {
      flex: 1; background: #1c1b1a; border: 1px solid var(--border);
      border-radius: 8px; padding: 8px; color: var(--text);
    }
    .scene-row button {
      background: transparent; border: 1px solid var(--accent); color: var(--accent);
      padding: 0 14px; border-radius: 8px; cursor: pointer;
    }
    .state-body, .alert-body { flex: 1; overflow-y: auto; padding: 12px; font-size: 13px; }
    .room { margin-bottom: 12px; }
    .room-name { color: var(--accent); font-weight: 600; margin-bottom: 6px; }
    .obj { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
    .obj .val { color: var(--muted); }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge.warning { background: rgba(217,164,65,.2); color: var(--warn); }
    .badge.alert { background: rgba(201,91,78,.2); color: var(--alert); }
    .badge.info { background: rgba(91,140,90,.2); color: var(--ok); }
    .alert-item { padding: 8px; border-left: 3px solid var(--warn); margin-bottom: 8px; background: #2e2b29; border-radius: 6px; }
    .alert-item.alert { border-left-color: var(--alert); }
    .alert-item .t { color: var(--muted); font-size: 11px; }
    .alert-item .s { font-size: 13px; margin: 4px 0; }
    .alert-item .r { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>A210 智能家居视觉 Agent</h1>
    <span class="sub">边缘视觉 · 端云协同 · 组合式判断</span>
  </header>

  <div class="layout">
    <!-- 左：聊天 -->
    <div class="card">
      <h2>自然语言问答</h2>
      <div class="chat-body" id="chatBody">
        <div class="msg agent">你好，我是智能家居视觉 Agent。可以问我「家里现在安全吗」「是不是忘关灯了」「老人在哪个房间」等问题。</div>
      </div>
      <div class="chat-input">
        <input id="question" placeholder="输入问题，回车发送…">
        <button id="sendBtn">发送</button>
      </div>
    </div>

    <!-- 右列 -->
    <div class="right-col">
      <div class="card" style="flex:0 0 auto;">
        <h2>场景控制（模拟感知层）</h2>
        <div class="scene-row">
          <select id="sceneSelect"></select>
          <button id="applyScene">切换</button>
        </div>
      </div>

      <div class="card" style="flex:1;">
        <h2>当前家居状态</h2>
        <div class="state-body" id="stateBody">加载中…</div>
      </div>

      <div class="card" style="flex:1;">
        <h2>事件告警</h2>
        <div class="alert-body" id="alertBody">暂无告警</div>
      </div>
    </div>
  </div>

  <script>
    const chatBody = document.getElementById('chatBody');
    const question = document.getElementById('question');
    const sendBtn = document.getElementById('sendBtn');
    const stateBody = document.getElementById('stateBody');
    const alertBody = document.getElementById('alertBody');
    const sceneSelect = document.getElementById('sceneSelect');
    const applyScene = document.getElementById('applyScene');

    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function send() {
      const q = question.value.trim();
      if (!q) return;
      addMsg('user', q);
      question.value = '';
      sendBtn.disabled = true;
      try {
        const resp = await fetch('/api/chat', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: q})
        });
        const data = await resp.json();
        addMsg('agent', data.answer || data.error || '（无回答）');
      } catch (e) {
        addMsg('agent', '（请求失败：' + e + '）');
      } finally {
        sendBtn.disabled = false;
      }
    }
    sendBtn.onclick = send;
    question.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    // 状态面板
    function renderState(s) {
      if (!s || s.error) { stateBody.textContent = s.error || '暂无数据'; return; }
      stateBody.innerHTML = '';
      const time = document.createElement('div');
      time.style.color = 'var(--muted)';
      time.style.marginBottom = '8px';
      time.textContent = '快照时间：' + (s.timestamp || '-');
      stateBody.appendChild(time);
      for (const room of (s.rooms || [])) {
        const rd = document.createElement('div');
        rd.className = 'room';
        const rn = document.createElement('div');
        rn.className = 'room-name';
        rn.textContent = room.room;
        rd.appendChild(rn);
        for (const o of (room.objects || [])) {
          const od = document.createElement('div');
          od.className = 'obj';
          const k = document.createElement('span');
          k.textContent = o.category;
          const v = document.createElement('span');
          v.className = 'val';
          v.textContent = o.category === 'person' ? `人数 ${o.count} / ${o.pose || '-'}`
            : o.category === 'light' ? o.state
            : o.category === 'pet' ? `数量 ${o.count}`
            : `${o.name} ${o.state}`;
          od.appendChild(k); od.appendChild(v);
          rd.appendChild(od);
        }
        stateBody.appendChild(rd);
      }
    }

    // 告警面板
    function renderAlerts(alerts) {
      if (!alerts || alerts.length === 0) { alertBody.textContent = '暂无告警'; return; }
      alertBody.innerHTML = '';
      for (const a of alerts) {
        const item = document.createElement('div');
        item.className = 'alert-item ' + (a.severity === 'alert' ? 'alert' : '');
        const t = document.createElement('div');
        t.className = 't';
        t.textContent = a.time + ' · ' + a.severity;
        const s = document.createElement('div');
        s.className = 's';
        s.textContent = a.summary;
        const r = document.createElement('div');
        r.className = 'r';
        r.textContent = a.response;
        item.appendChild(t); item.appendChild(s); item.appendChild(r);
        alertBody.appendChild(item);
      }
    }

    async function poll() {
      try {
        const [s, a] = await Promise.all([
          fetch('/api/state').then(r => r.json()),
          fetch('/api/alerts').then(r => r.json())
        ]);
        renderState(s);
        renderAlerts(a);
      } catch (e) { /* 忽略轮询错误 */ }
    }

    // 场景列表
    async function loadScenes() {
      const scenes = await fetch('/api/scenes').then(r => r.json());
      for (const s of scenes) {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sceneSelect.appendChild(opt);
      }
    }
    applyScene.onclick = async () => {
      await fetch('/api/scene', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({scene: sceneSelect.value})
      });
    };

    loadScenes();
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
